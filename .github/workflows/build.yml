name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="v$(tr -d '[:space:]' < VERSION)"
        fi
        version="${tag#v}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Verify build helpers and apply product branding
      run: |
        python -m py_compile scripts/generate_version_info.py scripts/apply_product_branding.py hud_gen.py
        python scripts/apply_product_branding.py hud_gen.py
        python -m py_compile hud_gen.py

    - name: Generate Windows version metadata
      if: runner.os == 'Windows'
      shell: pwsh
      run: python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

    - name: Build Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -m PyInstaller --noconfirm --clean --onefile --windowed --icon=icon.ico --version-file=branding/version_info.txt --name BZHoloTextGenerator --add-data "BZONE.ttf;." hud_gen.py
        if (!(Test-Path "dist/BZHoloTextGenerator.exe" -PathType Leaf)) { throw "Missing standalone dist/BZHoloTextGenerator.exe" }
        if (Test-Path "dist/BZHoloTextGenerator" -PathType Container) { throw "Unexpected onedir bundle dist/BZHoloTextGenerator" }
        Compress-Archive -Path "dist/BZHoloTextGenerator.exe" -DestinationPath "dist/Battlezone98Redux_HoloTextGen-${{ steps.version.outputs.tag }}-windows.zip" -Force

    - name: Build Linux executable
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        python -m PyInstaller --noconfirm --clean --onefile --windowed --name BZHoloTextGenerator --add-data "BZONE.ttf:." hud_gen.py
        test -f dist/BZHoloTextGenerator
        test ! -d dist/BZHoloTextGenerator
        tar -czf "dist/Battlezone98Redux_HoloTextGen-${{ steps.version.outputs.tag }}-linux.tar.gz" -C dist BZHoloTextGenerator

    - name: Build macOS executable
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        python -m PyInstaller --noconfirm --clean --onefile --windowed --name BZHoloTextGenerator --add-data "BZONE.ttf:." hud_gen.py
        test -f dist/BZHoloTextGenerator
        test ! -d dist/BZHoloTextGenerator
        tar -czf "dist/Battlezone98Redux_HoloTextGen-${{ steps.version.outputs.tag }}-macos.tar.gz" -C dist BZHoloTextGenerator

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: Battlezone98Redux_HoloTextGen-${{ matrix.platform }}
        path: |
          dist/Battlezone98Redux_HoloTextGen-*-windows.zip
          dist/Battlezone98Redux_HoloTextGen-*-linux.tar.gz
          dist/Battlezone98Redux_HoloTextGen-*-macos.tar.gz
        if-no-files-found: error
        retention-days: 7

  release:
    name: Create Release
    needs: build
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve release tag
      id: release_version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="v$(tr -d '[:space:]' < VERSION)"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: Battlezone98Redux_HoloTextGen-*
        path: release-assets
        merge-multiple: true

    - name: Verify release payload
      shell: bash
      run: |
        set -euo pipefail
        ls -lh release-assets
        test -f "release-assets/Battlezone98Redux_HoloTextGen-${{ steps.release_version.outputs.tag }}-windows.zip"
        test -f "release-assets/Battlezone98Redux_HoloTextGen-${{ steps.release_version.outputs.tag }}-linux.tar.gz"
        test -f "release-assets/Battlezone98Redux_HoloTextGen-${{ steps.release_version.outputs.tag }}-macos.tar.gz"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_version.outputs.tag }}
        name: ${{ steps.release_version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          release-assets/Battlezone98Redux_HoloTextGen-v*-windows.zip
          release-assets/Battlezone98Redux_HoloTextGen-v*-linux.tar.gz
          release-assets/Battlezone98Redux_HoloTextGen-v*-macos.tar.gz
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
